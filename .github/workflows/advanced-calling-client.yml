name: Advanced calling client checks

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, feat/advanced-calling-live-1.2.241]
  pull_request:
    branches: [main, feat/advanced-calling-live-1.2.241]

jobs:
  client-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Zanny001/zannychat-backend
          ref: main
          path: zannychat-back-github
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create non-production Firebase config for compile-only CI
        run: |
          if [ ! -f google-services.json ]; then
            cat > google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "zannychat-ci-placeholder",
              "storage_bucket": "zannychat-ci-placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:0000000000000000",
                "android_client_info": { "package_name": "com.zannychat.app" }
              },
              "api_key": [{ "current_key": "CI_ONLY_NOT_A_REAL_FIREBASE_KEY" }],
              "services": {}
            }],
            "configuration_version": "1"
          }
          JSON
          fi
      - run: npx expo config --type prebuild --json > /tmp/zannychat-expo-config.json
      - run: npx expo prebuild --platform android --no-install
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Compile native Kotlin sources and verify local Expo module autolinking.
      # This is a compile-only check; it does not assemble or publish an APK.
      - run: cd android && ./gradlew :app:compileDebugKotlin
      - name: Assemble Android debug APK for physical-device QA
        run: cd android && ./gradlew :app:assembleDebug
      - name: Upload Android debug APK for physical-device QA
        uses: actions/upload-artifact@v4
        with:
          name: zannychat-royal-neon-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - run: npx expo prebuild --platform ios --no-install
      - name: Verify iOS native CallKit end-event patch
        run: |
          grep -q "reportZannyChatNativeEnd" node_modules/expo-callkit-telecom/ios/Managers/CallManager.swift
          grep -q "zannychatSendNativeEndEvent" node_modules/expo-callkit-telecom/ios/Managers/CallManager.swift
          grep -q "reportZannyChatNativeEnd(for: action.callUUID" node_modules/expo-callkit-telecom/ios/Managers/CallManager+CXProviderDelegate.swift
          grep -q "ZannyChatNativeCallMappingModule" modules/zannychat-native-call-mapping/expo-module.config.json
      - run: npx expo export --platform web --output-dir /tmp/zannychat-web-export
      - run: npx expo export --platform android --output-dir /tmp/zannychat-android-export
      - run: npm run test:unit
      - run: npm run test:call-recovery
      - run: npm run test:native-call-receiver
      - run: npm run test:phase6-release-quality
      - run: npm run audit:release
      - run: npm run audit:contract
      - run: npm run audit:integrity
