name: Premium status and LIVE quality

on:
  push:
    branches: [feat/premium-status-live-1.2.244]
  pull_request:
    branches: [main]

concurrency:
  group: premium-status-live-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:call-recovery
      - run: npm run test:native-call-receiver
      - run: npm run audit:release
      - run: npm run audit:contract
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run test:integrity
