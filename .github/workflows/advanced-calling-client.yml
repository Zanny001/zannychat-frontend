name: Advanced calling client checks

on:
  push:
    branches: [feat/advanced-calling-live-1.2.241]
  pull_request:
    branches: [feat/advanced-calling-live-1.2.241]

jobs:
  client-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo config --type prebuild --json > /tmp/zannychat-expo-config.json
      - run: npx expo prebuild --platform android --no-install --non-interactive
      - run: npm run test:unit
      - run: npm run test:call-recovery
      - run: node --test plugins/callEndedReceiver.test.cjs
      - run: npm run audit:release
      - run: npm run audit:integrity
